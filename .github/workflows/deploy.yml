name: Publicar en Cloudflare Free
on:
  push:
    tags:
      - "publicar-v*"
      - "publicar-dominio-v*"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.cloudflare.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Crear o vincular D1
        id: database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-production.mjs database
      - name: Aplicar migraciones
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
        run: |
          node scripts/configure-d1.mjs "$DATABASE_ID"
          npx --no-install wrangler d1 migrations apply DB --remote
      - name: Comprobar el subdominio de Workers
        id: cloudflare
        env:
          REQUIRE_CUSTOM_DOMAIN: ${{ startsWith(github.ref_name, 'publicar-dominio-v') }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-production.mjs workers
      - name: Desplegar
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SITE_URL: ${{ steps.cloudflare.outputs.url }}
        run: npx --no-install wrangler deploy --var "PUBLIC_URL:$SITE_URL" --var "TELEGRAM_ENABLED:true"
      - name: Cargar histórico autorizado de precios
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_ID: ${{ steps.database.outputs.database_id }}
        run: |
          sql="$RUNNER_TEMP/costco-initial-history.sql"
          trap 'rm -f "$sql"' EXIT
          node scripts/seed-history.mjs "$sql"
          if [ -s "$sql" ]; then npx --no-install wrangler d1 execute DB --remote --file "$sql" --yes; fi
      - name: Verificar portada y estado de las fuentes
        env:
          SITE_URL: ${{ steps.cloudflare.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$SITE_URL/" -o /tmp/costco-site.html &&
              grep -q 'Proyecto independiente' /tmp/costco-site.html &&
              grep -q 'class="wordmark">CostGas<' /tmp/costco-site.html &&
              grep -q '<h1>Precios por estación</h1>' /tmp/costco-site.html &&
              ! grep -Eq 'href="/(gasolineras|mapa|comparador|alertas)"' /tmp/costco-site.html &&
              ! grep -q 'https://t.me/' /tmp/costco-site.html &&
              grep -q 'Desarrollado por <a href="https://zetaweb.es/">zetaweb.es' /tmp/costco-site.html; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 5
          done
          curl -fsS --retry 3 "$SITE_URL/api/v1/status" | jq -e '.telegramEnabled == true and (has("officialEnabled") | not)'
          curl -fsS --retry 3 "$SITE_URL/api/v1/sources" | jq -e '[.data[].id] == ["telegram"] and all(.data[]; has("url") | not)'
          curl -fsS --retry 3 "$SITE_URL/api/v1/prices" | jq -e '(.data|length)>0 and all(.data[]; .source == "telegram" and (has("source_url") | not))'
          curl -fsS --retry 3 "$SITE_URL/robots.txt" | grep -F "$SITE_URL/sitemap.xml"
          curl -fsS --retry 3 "$SITE_URL/sitemap.xml" | grep -F "$SITE_URL/historico?station="
          curl -fsS --retry 3 "$SITE_URL/calculadora" | grep -F '<link rel="canonical"'
          printf 'Web publicada y verificada. %s\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
