name: Publicar en Cloudflare Free
on:
  push:
    tags:
      - 'publicar-v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.cloudflare.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Comprobar Cloudflare y vincular D1
        id: cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare-production.mjs
      - name: Migrar y desplegar
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_ID: ${{ steps.cloudflare.outputs.database_id }}
          SITE_URL: ${{ steps.cloudflare.outputs.url }}
        run: |
          node scripts/configure-d1.mjs "$DATABASE_ID"
          npx --no-install wrangler d1 migrations apply DB --remote
          npx --no-install wrangler deploy --var "PUBLIC_URL:$SITE_URL"
      - name: Verificar portada y estado de las fuentes
        env:
          SITE_URL: ${{ steps.cloudflare.outputs.url }}
        run: |
          curl -fsS --retry 6 --retry-all-errors --retry-delay 5 "$SITE_URL/" -o /tmp/costco-site.html
          grep -q 'Proyecto independiente' /tmp/costco-site.html
          curl -fsS --retry 3 "$SITE_URL/api/v1/status" | jq -e '.telegramEnabled == false and .officialEnabled == false'
          printf 'Web publicada y verificada. %s\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
