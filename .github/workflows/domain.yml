name: Conectar costgas.zetaweb.es
on:
  push:
    tags: ["dominio-v*"]
permissions:
  contents: read
concurrency:
  group: costgas-custom-domain
  cancel-in-progress: false
jobs:
  connect:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Crear el proyecto de Pages
        run: node scripts/pages-domain.mjs create
      - run: npm ci
      - name: Conectar Pages al Worker
        run: npx --no-install wrangler pages deploy pages --project-name costgas-zetaweb --branch costgas-production
      - name: Registrar el dominio
        run: node scripts/pages-domain.mjs attach
      - name: Comprobar la pasarela
        run: curl -fsS --retry 6 --retry-all-errors --retry-delay 5 https://costgas-zetaweb.pages.dev/api/v1/prices | jq -e '(.data | length) > 0'
